<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Text Extractor</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent: #bb86fc;
            --error-color: #cf6679;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        input {
            flex-grow: 1;
            padding: 12px 16px;
            font-size: 16px;
            background: #1e1e1e;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #error-box {
            display: none;
            background: rgba(207, 102, 121, 0.1);
            border-left: 4px solid var(--error-color);
            padding: 10px 15px;
            color: var(--error-color);
            font-size: 14px;
            border-radius: 4px;
            word-break: break-all;
        }
        .debug-info {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        #text-display {
            flex-grow: 1;
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <form class="input-group" id="fetch-form">
        <input type="url" id="url-input" placeholder="Paste URL here (e.g., https://en.wikipedia.org/wiki/Web_scraping)" required autocomplete="off">
        <button type="submit" id="submit-btn">Extract</button>
    </form>

    <div id="error-box">
        <div id="error-msg"></div>
        <div class="debug-info" id="debug-msg"></div>
    </div>

    <div id="text-display">Enter a URL above to extract clean text.</div>
</div>

<script>
    const form = document.getElementById('fetch-form');
    const input = document.getElementById('url-input');
    const btn = document.getElementById('submit-btn');
    const display = document.getElementById('text-display');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const debugMsg = document.getElementById('debug-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const url = input.value.trim();
        if (!url) return;

        // Reset UI state
        btn.disabled = true;
        btn.textContent = 'Extracting...';
        display.textContent = 'Extracting content... This may take a few seconds.';
        errorBox.style.display = 'none';

        try {
            // Call the Vercel Edge API
            const response = await fetch(`/api/extract?url=${encodeURIComponent(url)}`);
            
            // Check for severe network errors
            if (!response.ok && response.status !== 200) {
                throw new Error(`Server responded with status: ${response.status}`);
            }

            const data = await response.json();

            if (data.success) {
                // Success: Display clean text
                display.textContent = data.text;
            } else {
                // Handled API Failure
                display.textContent = data.text; // Show the fallback message in the main window
                showError(data.error, data.debug);
            }
        } catch (err) {
            // Unhandled network/parsing error
            display.textContent = "A critical error occurred preventing the request from completing.";
            showError("Network or Server Error: " + err.message);
        } finally {
            // Restore UI
            btn.disabled = false;
            btn.textContent = 'Extract';
        }
    });

    function showError(mainError, debugData = null) {
        errorBox.style.display = 'block';
        errorMsg.textContent = mainError;
        if (debugData && debugData.errors) {
            debugMsg.innerHTML = `<strong>Debug Log:</strong><br>${debugData.errors.join('<br>')}`;
        } else {
            debugMsg.textContent = '';
        }
    }
</script>

</body>
</html>
